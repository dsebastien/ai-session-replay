name: Bug report
description: Report reproducible incorrect behavior without sharing private session data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach real transcripts, databases, credentials, tokens, private paths, or exported videos.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The app version or commit that exhibits the problem.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Session source
      options:
        - Claude Code
        - Codex CLI
        - GitHub Copilot CLI
        - VS Code Copilot Chat
        - JetBrains detection
        - Presentation or export
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only path-free error codes or redacted diagnostics.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed transcripts, credentials, tokens, private paths, databases, and other personal data.
          required: true
